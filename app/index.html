<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="css/style.min.css">
</head>

<body>
  <header class="header">
    <a class="logo__link" href="#">
      <img class="logo__img" src="images/logo.svg" alt="Логотип">
    </a>
    <div class="header__inner">
      <div class="header__info">
        <p class="header__phone">+7 988 740 5533</p>
        <p class="header__time">9:00 - 21:00</p>
      </div>
      <button class="header__btn">
        <img class="header__btn-phone" src="images/phone-white.svg" alt="Кнопка телефон">
      </button>
    </div>
  </header>
  <main class="main">
    <div class="container">
      <div class="modal-phone">
        <div class="modal-phone__info">
          <h4 class="modal-phone__title">
            Оставьте ваш
            номер телефона
            <span>и наш оператор перезвонит вам</span>
          </h4>
          <img class="modal-phone__img" src="images/operator.jpg" alt="Оператор">
        </div>
        
      </div>
    </div>
  </main>


  <script src="js/main.min.js"></script>
</body>

</html>
